# SalmanPlex on Kubernetes.
#
# Prerequisites:
#   kubectl create namespace salmanplex
#   kubectl -n salmanplex create secret generic salmanplex-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 48)" \
#     --from-literal=DATABASE_URL="postgres://salmanplex:<password>@<host>:5432/salmanplex" \
#     --from-literal=TMDB_API_KEY=""
#   kubectl -n salmanplex apply -f k8s/
#
# PostgreSQL is expected to be provided separately (managed DB or operator).
# The app runs as a single replica: transcode jobs and scans are per-process.
apiVersion: v1
kind: ConfigMap
metadata:
  name: salmanplex-config
  labels: { app: salmanplex }
data:
  NODE_ENV: production
  PORT: "3000"
  MEDIA_ROOT: /media
  CACHE_DIR: /cache
  TRUST_PROXY: "1"
  MAX_TRANSCODES: "2"
  ALLOW_REGISTRATION: "false"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: salmanplex-media
  labels: { app: salmanplex }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 500Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: salmanplex-cache
  labels: { app: salmanplex }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: salmanplex
  labels: { app: salmanplex }
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volumes + in-process transcoder state
  selector:
    matchLabels: { app: salmanplex }
  template:
    metadata:
      labels: { app: salmanplex }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 15
      containers:
        - name: salmanplex
          image: ghcr.io/onenetwork-tech/salmanplex:1.0.0 # pin a version; never :latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef: { name: salmanplex-config }
            - secretRef: { name: salmanplex-secrets }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "4", memory: 2Gi } # transcoding is CPU heavy
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: media, mountPath: /media }
            - { name: cache, mountPath: /cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: media
          persistentVolumeClaim: { claimName: salmanplex-media }
        - name: cache
          persistentVolumeClaim: { claimName: salmanplex-cache }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: salmanplex
  labels: { app: salmanplex }
spec:
  type: ClusterIP # expose through the Ingress (TLS) rather than a public LoadBalancer
  selector: { app: salmanplex }
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: salmanplex
  labels: { app: salmanplex }
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "4g" # large uploads
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600" # long streams
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [media.example.com]
      secretName: salmanplex-tls
  rules:
    - host: media.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: salmanplex
                port: { name: http }
