apiVersion: apps/v1
kind: Deployment
metadata:
  name: salmanplex-deployment
  labels:
    app: salmanplex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: salmanplex
  template:
    metadata:
      labels:
        app: salmanplex
    spec:
      containers:
      - name: salmanplex
        image: salmanplex:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: salmanplex-service
spec:
  selector:
    app: salmanplex
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer